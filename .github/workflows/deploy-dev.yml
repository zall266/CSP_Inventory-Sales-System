name: Deploy DEV

on:
  workflow_dispatch:
  # Cloud agents authenticate as a GitHub App whose token can push this
  # branch but cannot call the workflow-dispatch API (that call requires
  # actions: write and returns 403). A push of this branch starts the same
  # job. The job token stays contents: read. Clasp still uses the dev
  # environment secret, not the GitHub token.
  push:
    branches:
      - cursor/module-1-identity-settings-d9ac

permissions:
  contents: read

jobs:
  deploy:
    name: Push and publish DEV web app
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check clasp target
        working-directory: apps-script
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          const cfg = JSON.parse(fs.readFileSync('.clasp.json', 'utf8'))
          const expected = '1mkRzptY0mzHnzOFB8TA6AGIZyv6q2gJq-QdKPBWtV91oq5okHWVpY4Jj'
          if (cfg.scriptId !== expected || cfg.rootDir !== '.') {
            console.error('apps-script/.clasp.json does not target the existing DEV Apps Script project.')
            process.exit(1)
          }
          console.log('clasp target confirmed')
          EOF

      - name: Write clasp credentials
        env:
          CSP_DEV_CLASP_CREDENTIALS: ${{ secrets.CSP_DEV_CLASP_CREDENTIALS }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          import os from 'node:os'
          import path from 'node:path'
          const raw = process.env.CSP_DEV_CLASP_CREDENTIALS
          if (!raw || !raw.trim()) {
            console.error('CSP_DEV_CLASP_CREDENTIALS is empty.')
            process.exit(1)
          }
          let parsed
          try {
            parsed = JSON.parse(raw)
          } catch {
            console.error('CSP_DEV_CLASP_CREDENTIALS is not valid JSON.')
            process.exit(1)
          }
          const token = parsed.tokens && parsed.tokens.default
          if (!token || token.type !== 'authorized_user' || !token.client_id || !token.client_secret || !token.refresh_token) {
            console.error('CSP_DEV_CLASP_CREDENTIALS is missing the authorized_user token fields.')
            process.exit(1)
          }
          for (const part of [token.client_id, token.client_secret, token.refresh_token]) {
            process.stdout.write(`::add-mask::${part}\n`)
          }
          const dest = path.join(os.homedir(), '.clasprc.json')
          fs.writeFileSync(dest, raw.endsWith('\n') ? raw : `${raw}\n`, { mode: 0o600 })
          fs.chmodSync(dest, 0o600)
          console.log('clasp credentials file created')
          EOF

      - name: Push Apps Script source
        working-directory: apps-script
        run: npx --yes @google/clasp@3.4.1 push --force

      # Reads CSP_DEV_WEBAPP_DEPLOYMENT_ID from the dev environment variables.
      # That value is not a secret. An empty value creates the one initial
      # deployment only when the project has none. A later run redeploys that
      # same id. If a deployment already exists and the variable is empty, the
      # script fails closed and does not create another deployment.
      - name: Publish the single DEV web app
        env:
          CSP_DEV_WEBAPP_DEPLOYMENT_ID: ${{ vars.CSP_DEV_WEBAPP_DEPLOYMENT_ID }}
        run: node .github/scripts/devWebappDeployment.mjs

      - name: Remove clasp credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
